<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVE_SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --bg: #ffdae0;
            --win-bg: #ece0f8;
            --win-border-light: #ffffff;
            --win-border-dark: #808080;
            --pink: #ff9aa2;
            --blue: #b5ead7;
            --navy: #000080;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'VT323', monospace;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #world {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
        }

        #boot-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000080;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .boot-text {
            color: #aaaaaa;
            font-size: clamp(0.8rem, 2.5vw, 1.15rem);
            text-align: left;
            width: 600px;
            max-width: 100%;
            line-height: 1.8;
        }

        .boot-text .highlight { color: #ffffff; }
        .boot-text .love { color: #ff6b9d; }

        #password-section {
            margin-top: 20px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 400px;
        }

        #password-section label {
            color: #ffffff;
            font-size: clamp(1rem, 3vw, 1.4rem);
            display: block;
            margin-bottom: 10px;
        }

        #password-input {
            background: #000;
            border: 2px solid #aaa;
            color: #00ff00;
            font-family: 'VT323', monospace;
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            padding: 8px 15px;
            text-align: center;
            width: 220px;
            max-width: 80%;
            outline: none;
        }

        #password-error {
            color: #ff4444;
            font-size: 1.2rem;
            margin-top: 10px;
            min-height: 25px;
        }

        .boot-btn {
            background: #444;
            border: 2px solid #aaa;
            color: white;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            padding: 6px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        .boot-btn:hover { background: #666; }
        .boot-btn:active { background: #888; }

        #taskbar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%; height: 40px;
            background: #c0c0c0;
            border-top: 2px solid white;
            z-index: 100;
            display: none;
            align-items: center;
            padding: 0 4px;
            justify-content: space-between;
        }

        #start-btn {
            background: #c0c0c0;
            border: 2px outset #fff;
            font-family: 'VT323', monospace;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            padding: 2px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        #taskbar-clock {
            background: #c0c0c0;
            border: 2px inset #888;
            padding: 2px 8px;
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            color: #000;
            white-space: nowrap;
        }

        #taskbar-title {
            flex: 1;
            margin-left: 6px;
            background: var(--navy);
            color: white;
            padding: 2px 6px;
            font-size: clamp(0.7rem, 2vw, 1rem);
            border: 2px inset #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: calc(100% - 40px);
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 10px;
        }

        .window {
            pointer-events: auto;
            width: 480px;
            max-width: 100%;
            max-height: calc(100vh - 60px);
            background: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            animation: pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: scale(0) rotate(-5deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .title-bar {
            background: linear-gradient(90deg, var(--pink), var(--blue));
            padding: 4px 6px;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
        }

        .title-bar-buttons { display: flex; gap: 2px; }

        .title-bar-btn {
            width: 18px; height: 18px;
            background: #c0c0c0;
            border: 2px outset #fff;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-family: 'VT323', monospace;
        }

        .content {
            padding: 15px;
            text-align: center;
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #444;
            overflow-y: auto;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .content::-webkit-scrollbar { width: 16px; }
        .content::-webkit-scrollbar-track { background: #f0f0f0; border: 1px inset #ccc; }
        .content::-webkit-scrollbar-thumb { background: #c0c0c0; border: 2px outset #ddd; }

        .btn {
            background: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
            padding: 6px 18px;
            font-family: inherit;
            font-size: clamp(1rem, 3vw, 1.2rem);
            cursor: pointer;
            margin-top: 12px;
            transition: 0.15s;
        }
        .btn:active { border-style: inset; }
        .btn:hover { background: #ffe0e8; }

        .btn-pink { background: var(--pink); color: white; }
        .btn-pink:hover { background: #ff8a94; }

        .ll-progress {
            width: 100%; height: 10px;
            background: #ddd;
            border: 1px inset #ccc;
            margin-bottom: 15px;
            border-radius: 5px;
            overflow: hidden;
        }

        .ll-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pink), #ff6b9d);
            transition: width 0.4s ease;
            border-radius: 5px;
        }

        .ll-question {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            color: var(--navy);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .ll-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            margin: 6px 0;
            background: white;
            border: 2px outset #ccc;
            font-family: inherit;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.3;
        }

        .ll-option:hover {
            background: #ffe0e8;
            transform: translateX(4px);
            border-color: var(--pink);
        }

        .ll-option:active { border-style: inset; background: #ffd0d8; }

        .ll-result-bar-wrap { margin: 8px 0; }

        .ll-result-header {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.8rem, 2.2vw, 1rem);
            color: #555;
            margin-bottom: 3px;
        }

        .ll-result-track {
            width: 100%; height: 22px;
            background: #eee;
            border: 1px inset #ccc;
            border-radius: 3px;
            overflow: hidden;
        }

        .ll-result-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1.2s ease;
            width: 0%;
        }

        .ll-result-fill.words { background: linear-gradient(90deg, #667eea, #764ba2); }
        .ll-result-fill.time { background: linear-gradient(90deg, #f093fb, #f5576c); }
        .ll-result-fill.gifts { background: linear-gradient(90deg, #43e97b, #38f9d7); }
        .ll-result-fill.service { background: linear-gradient(90deg, #4facfe, #00f2fe); }
        .ll-result-fill.touch { background: linear-gradient(90deg, #fa709a, #fee140); }

        .ll-description {
            background: white;
            border: 2px inset #ccc;
            padding: 14px;
            margin: 12px 0;
            text-align: left;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            line-height: 1.5;
            color: #444;
        }

        .option-card {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            margin: 6px 0;
            background: white;
            border: 2px outset #ccc;
            font-family: inherit;
            font-size: clamp(0.95rem, 2.8vw, 1.15rem);
            cursor: pointer;
            transition: 0.2s;
        }

        .option-card:hover {
            background: #ffe0e8;
            transform: translateX(4px);
        }

        .option-card:active { border-style: inset; }

        .option-card.selected {
            background: #d4edda;
            border-color: #28a745;
        }

        .input-area {
            width: 100%;
            min-height: 80px;
            background: white;
            border: 2px inset #ccc;
            font-family: 'VT323', monospace;
            font-size: clamp(1rem, 3vw, 1.2rem);
            padding: 12px;
            resize: vertical;
            outline: none;
            color: #333;
            line-height: 1.5;
        }

        .input-area:focus { border-color: var(--pink); }
        .input-area::placeholder { color: #bbb; }

        .music-option {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0;
            background: #1a1a2e;
            border: 2px outset #444;
            color: white;
            font-family: inherit;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            cursor: pointer;
            transition: 0.25s;
            border-radius: 4px;
            position: relative;
        }

        .music-option .song-info { text-align: left; flex: 1; }
        .music-option .song-title { font-size: clamp(0.95rem, 2.5vw, 1.15rem); }
        .music-option .song-artist { font-size: clamp(0.75rem, 2vw, 0.9rem); opacity: 0.6; }

        .movie-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            margin: 6px 0;
            background: white;
            border: 2px outset #ccc;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
        }

        .movie-option:hover {
            background: #ffe0e8;
            transform: translateX(4px);
            border-color: var(--pink);
        }

        .movie-option:active { border-style: inset; }

        .movie-title {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: var(--navy);
            font-weight: bold;
        }

        .movie-genre {
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            color: #888;
            margin-top: 2px;
        }

        .yn-container {
            position: relative;
            width: 100%;
            height: 160px;
            margin-top: 15px;
        }

        .yn-yes {
            background: #d4edda;
            border: 2px outset #28a745;
            padding: 10px 25px;
            font-family: inherit;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            z-index: 2;
        }
        .yn-yes:hover { transform: scale(1.1); background: #b7dfbf; }

        .yn-no {
            background: #f8d7da;
            border: 2px outset #dc3545;
            padding: 10px 25px;
            font-family: inherit;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            cursor: pointer;
            position: absolute;
            z-index: 3;
            transition: none;
        }

        .yn-btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        #clippy-wrap {
            position: fixed;
            bottom: 45px;
            left: 10px;
            z-index: 200;
            display: none;
            cursor: pointer;
        }

        #clippy-canvas-3d {
            width: 80px;
            height: 100px;
            display: block;
        }

        .clippy-bubble {
            position: absolute;
            bottom: 105px;
            left: -5px;
            width: clamp(180px, 55vw, 260px);
            background: #ffffcc;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: clamp(0.8rem, 2.2vw, 1rem);
            color: #333;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            display: none;
            line-height: 1.4;
            z-index: 201;
        }

        .clippy-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 30px;
            border: 5px solid transparent;
            border-top-color: #333;
        }

        .clippy-bubble::before {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 31px;
            border: 4px solid transparent;
            border-top-color: #ffffcc;
            z-index: 1;
        }

        .clippy-name {
            font-weight: bold;
            color: var(--navy);
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            margin-bottom: 3px;
        }

        .clippy-close {
            position: absolute;
            top: 2px; right: 5px;
            cursor: pointer;
            font-size: 1rem;
            color: #888;
            background: none;
            border: none;
            font-family: inherit;
        }
        .clippy-close:hover { color: #333; }

        .avatar-notification {
            position: fixed;
            bottom: 155px;
            left: 15px;
            background: white;
            border: 2px solid var(--pink);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: var(--navy);
            z-index: 300;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            animation: notifPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: clamp(200px, 70vw, 280px);
        }

        @keyframes notifPop {
            from { transform: scale(0) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .floating-hearts {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }

        .float-heart {
            position: absolute; bottom: -50px;
            font-size: 2rem;
            animation: floatUp 4s ease-in forwards;
            opacity: 0.8;
            color: var(--pink);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .particle-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--pink);
            border-radius: 50%;
            opacity: 0.3;
            animation: particleFloat 8s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .scene-transition { animation: slideIn 0.4s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            #ui { padding: 5px; }
            .content { padding: 12px 10px; }
            .window { max-height: calc(100vh - 55px); }
            .ll-option, .option-card, .music-option, .movie-option { padding: 8px 10px; margin: 4px 0; }
            #clippy-wrap { left: 5px; bottom: 42px; }
            #clippy-canvas-3d { width: 65px; height: 82px; }
            .clippy-bubble { bottom: 87px; }
            .avatar-notification { bottom: 130px; left: 8px; }
        }

        @media (max-width: 360px) {
            .content { padding: 10px 8px; }
            .ll-option, .option-card { font-size: 0.85rem; padding: 7px 8px; }
            .music-option { gap: 8px; padding: 7px 8px; }
        }

        @media (max-height: 600px) {
            .window { max-height: calc(100vh - 50px); }
            .content { padding: 10px; }
        }

        @media (max-height: 450px) and (orientation: landscape) {
            .window { max-height: calc(100vh - 45px); }
            .content { padding: 8px; font-size: 0.95rem; }
            .ll-option, .option-card { padding: 6px 8px; margin: 3px 0; }
        }
    </style>
</head>
<body>

    <canvas id="world"></canvas>

    <div id="boot-screen">
        <div class="boot-text" id="boot-text"></div>
        <div id="password-section">
            <label>🔒 Masukin tanggal rahasia kita:</label>
            <input type="text" id="password-input" maxlength="10" autocomplete="off">
            <div id="password-error"></div>
            <div style="color: var(--pink); margin-top: 15px; font-size: 1.2rem;">happy valentine sayang 💕</div>
            <button class="boot-btn" onclick="checkPassword()">BUKA ♥</button>
        </div>
    </div>

    <div id="taskbar">
        <div style="display:flex; align-items: center; flex:1; min-width:0;">
            <button id="start-btn">💕 Start</button>
            <div id="taskbar-title">LOVE_SYSTEM</div>
        </div>
        <div id="taskbar-clock"></div>
    </div>

    <div class="particle-container" id="particles"></div>
    <div class="floating-hearts" id="floating-hearts"></div>

    <div id="clippy-wrap" onclick="toggleClippyBubble(event)">
        <div class="clippy-bubble" id="clippy-bubble">
            <button class="clippy-close" onclick="event.stopPropagation(); hideClippyBubble()">X</button>
            <div class="clippy-name">📎 Clippy:</div>
            <div id="clippy-text">Hai! Aku temenin kamu ya! 💕</div>
        </div>
        <canvas id="clippy-canvas-3d"></canvas>
    </div>

    <div id="ui">
        <div class="window" id="main-window">
            <div class="title-bar">
                <span id="win-title">SYSTEM</span>
                <div class="title-bar-buttons">
                    <div class="title-bar-btn">_</div>
                    <div class="title-bar-btn">[]</div>
                    <div class="title-bar-btn">X</div>
                </div>
            </div>
            <div class="content" id="win-content"></div>
        </div>
    </div>

    <script>

        function initClippy3D() {
            const canvas = document.getElementById('clippy-canvas-3d');
            const w = canvas.clientWidth || 80;
            const h = canvas.clientHeight || 100;

            cScene = new THREE.Scene();
            cCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
            cCamera.position.set(0, 0, 4);
            cCamera.lookAt(0, 0, 0);

            cRenderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            cRenderer.setSize(w, h);
            cRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            cRenderer.setClearColor(0x000000, 0);

            cScene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dir = new THREE.DirectionalLight(0xffffff, 0.6);
            dir.position.set(2, 3, 3);
            cScene.add(dir);

            cClippy = new THREE.Group();

            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3( 0.0, -0.6, 0 ),
                new THREE.Vector3( 0.4, -0.6, 0 ),
                new THREE.Vector3( 0.4,  0.5, 0 ),
                new THREE.Vector3( 0.0,  0.7, 0 ),
                new THREE.Vector3(-0.4,  0.5, 0 ),
                new THREE.Vector3(-0.4, -0.8, 0 ),
                new THREE.Vector3( 0.0, -1.0, 0 ),
                new THREE.Vector3( 0.6, -0.8, 0 ),
                new THREE.Vector3( 0.6,  0.6, 0 ),
            ], false, 'catmullrom', 0.5);

            const tubeGeom = new THREE.TubeGeometry(curve, 64, 0.08, 8, false);
            const silverMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.8, roughness: 0.2});
            const clippyMesh = new THREE.Mesh(tubeGeom, silverMat);

            const scleraGeom = new THREE.SphereGeometry(0.12, 16, 16);
            const scleraMat = new THREE.MeshBasicMaterial({color: 0xffffff});
            
            const scleraL = new THREE.Mesh(scleraGeom, scleraMat);
            scleraL.position.set(0.2, 0.55, 0.09);
            scleraL.scale.set(1, 1.2, 0.4);

            const scleraR = new THREE.Mesh(scleraGeom, scleraMat);
            scleraR.position.set(-0.2, 0.55, 0.09);
            scleraR.scale.set(1, 1.2, 0.4);

            const pupilGeom = new THREE.SphereGeometry(0.045, 16, 16);
            const pupilMat = new THREE.MeshBasicMaterial({color: 0x000000});

            const pupilL = new THREE.Mesh(pupilGeom, pupilMat);
            pupilL.position.set(0.2, 0.55, 0.15);

            const pupilR = new THREE.Mesh(pupilGeom, pupilMat);
            pupilR.position.set(-0.2, 0.55, 0.15);

            // 3D Heart Asset
            const heartShape = new THREE.Shape();
            heartShape.moveTo(0, 0);
            heartShape.bezierCurveTo(0, 0, -0.05, -0.12, -0.14, -0.12);
            heartShape.bezierCurveTo(-0.24, -0.12, -0.24, 0, -0.24, 0);
            heartShape.bezierCurveTo(-0.24, 0.08, -0.12, 0.17, 0, 0.24);
            heartShape.bezierCurveTo(0.12, 0.17, 0.24, 0.08, 0.24, 0);
            heartShape.bezierCurveTo(0.24, 0, 0.24, -0.12, 0.14, -0.12);
            heartShape.bezierCurveTo(0.05, -0.12, 0, 0, 0, 0);

            const heartExtrude = new THREE.ExtrudeGeometry(heartShape, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 });
            const heartMat3D = new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.4 });
            const heartMesh = new THREE.Mesh(heartExtrude, heartMat3D);
            heartMesh.position.set(0.4, 0.1, 0.2);
            heartMesh.rotation.z = Math.PI;
            heartMesh.scale.set(0.6, 0.6, 0.6);
            heartMesh.name = 'clippyHeart';

            cClippy.add(clippyMesh, scleraL, scleraR, pupilL, pupilR, heartMesh);
            cScene.add(cClippy);

            cClock = new THREE.Clock();
            animateClippy();
        }

        function animateClippy() {
            requestAnimationFrame(animateClippy);
            if (!cClippy || !cRenderer) return;

            const t = cClock.getElapsedTime();
            cClippy.position.y = Math.sin(t * 1.5) * 0.1;
            cClippy.rotation.y = Math.sin(t * 0.6) * 0.2;
            cClippy.rotation.z = Math.sin(t * 0.8) * 0.05;

            cClippy.traverse(child => {
                if (child.name === 'clippyHeart') {
                    child.position.y = 0.1 + Math.sin(t * 3) * 0.05;
                    child.rotation.y = Math.sin(t * 2) * 0.2;
                    const s = 0.6 + Math.sin(t * 4) * 0.05;
                    child.scale.set(s, s, s);
                }
            });

            cRenderer.render(cScene, cCamera);
        }

        function renderLLQ() {
            const content = document.getElementById('win-content');
            const total = LL_QUIZ.length;

            if (llIndex >= total) {
                const sum = Object.values(llScores).reduce((a,b) => a+b, 0) || 1;
                const pcts = {};
                for (const k in llScores) pcts[k] = Math.round((llScores[k]/sum)*100);
                collectedData.love_language_scores = pcts;
                const sorted = Object.entries(pcts).sort((a,b) => b[1]-a[1]);
                collectedData.love_language_primary = LL_INFO[sorted[0][0]].name;
                currentScene = SCENES.indexOf('llResult');
                renderScene();
                return;
            }

            const q = LL_QUIZ[llIndex];
            const progress = (llIndex/total)*100;
            const shuffled = [...q.options].sort(() => Math.random()-0.5);

            content.innerHTML = `<div class="scene-transition">
                <div style="font-size:clamp(0.8rem,2.2vw,1rem);color:#888;margin-bottom:5px">
                    💕 Quiz Bahasa Cinta - ${llIndex+1} dari ${total}
                </div>
                <div class="ll-progress"><div class="ll-progress-fill" style="width:${progress}%"></div></div>
                <div class="ll-question">${q.q}</div>
                ${shuffled.map(o => `<button class="ll-option" onclick="ansLL('${o.lang}')">${o.text}</button>`).join('')}
            </div>`;
        }

            upd(); setInterval(upd, 1000);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xffdae0, 0.035);
        const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 300);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('world'),alpha:true,antialias:true});
        renderer.setSize(innerWidth,innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio,2));

        const hs = new THREE.Shape();

        hs.bezierCurveTo(1.2,1.54,1.6,1.1,1.6,.7);
        hs.bezierCurveTo(1.6,.7,1.6,0,1,0);
        hs.bezierCurveTo(.7,0,.5,.5,.5,.5);

        const hg = new THREE.ExtrudeGeometry(hs,{depth:0.15,bevelEnabled:false});
        const hc = [0xff9aa2,0xffb7b2,0xffdac1,0xb5ead7,0xc7ceea,0xff6b9d];

            const s = 0.2+Math.random()*0.6; mesh.scale.set(s,s,s);
            mesh.userData = {rs:(Math.random()-0.5)*0.015,fs:Math.random()*0.008+0.003,fo:Math.random()*Math.PI*2};

            camera.rotation.z = Math.sin(Date.now()*0.00025)*0.03;
            scene.children.forEach(c => {
                if (c.userData?.rs) {
                    c.rotation.y += c.userData.rs;
                    c.position.y += Math.sin(Date.now()*c.userData.fs+c.userData.fo)*0.002;
                }
            });
            renderer.render(scene,camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth,innerHeight);
        });

        runBoot();
    </script>
</body>
</html>
